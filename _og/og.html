<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Cormorant";font-weight:300;font-style:normal;src:url(../assets/fonts/cormorant-garamond-latin-300-normal.woff2) format("woff2")}
@font-face{font-family:"Cormorant";font-weight:300;font-style:italic;src:url(../assets/fonts/cormorant-garamond-latin-300-italic.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:500;src:url(../assets/fonts/inter-latin-500-normal.woff2) format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#fff;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#0d0b10;position:relative}
body::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:linear-gradient(90deg,#7b4fd6,#e0559a)}
.eb{display:flex;align-items:center;gap:14px;font:500 20px "Inter",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:rgba(13,11,16,.6);margin-bottom:34px}
.eb i{width:13px;height:13px;border-radius:50%;background:#e0559a}
h1{font:300 94px/1.02 "Cormorant",serif;letter-spacing:-.01em}
em{font-style:italic;background:linear-gradient(90deg,#7b4fd6,#e0559a);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
</style></head>
<body>
<div class="eb"><i></i>She Creates · nur für die Community</div>
